
name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", ]
        os: [
          ubuntu-latest,
          windows-latest,
          macOS-latest,
        ]
        # one version of Python per operating system, so that both supported
        # versions are exercised with only three jobs. The older version is
        # the compatibility floor, so it gets two operating systems, and the
        # newer one goes to Windows, where the failures which are specific to
        # one platform have shown up
        exclude:
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.13"
            os: macOS-latest
          - python-version: "3.12"
            os: windows-latest
    name: Python ${{ matrix.python-version }}, ${{ matrix.os }} test
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .[test]
      - name: Test with pytest
        env:
          MPLBACKEND: "agg"
          # every xdist worker is single-threaded, otherwise the BLAS, OpenMP
          # and Numba thread pools of the workers compete for the same cores
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml -n auto
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: true
