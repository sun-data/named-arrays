
name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [
          ubuntu-latest,
          windows-latest,
          macOS-latest,
        ]
    name: Python ${{ matrix.python-version }}, ${{ matrix.os }} test
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .[test]
      - name: Test with pytest
        env:
          MPLBACKEND: "agg"
          # every xdist worker is single-threaded, otherwise the BLAS, OpenMP
          # and Numba thread pools of the workers compete for the same cores
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
          # the sys.monitoring core of coverage.py measures line coverage at
          # almost no cost, whereas the default tracer slows the suite ~1.8x
          COVERAGE_CORE: "sysmon"
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml -n auto --durations=25
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: true
