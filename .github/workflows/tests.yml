
name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", ]
        os: [
          ubuntu-latest,
          windows-latest,
          macOS-latest,
        ]
        group: [1, 2, 3, 4, 5]
        # one version of Python per operating system, so that both supported
        # versions are exercised while the job count stays at the 15 it was:
        # GitHub runs at most 20 jobs at once, and the other workflows need
        # runners too. The older version is the compatibility floor, so it
        # gets two operating systems, and the newer one goes to Windows,
        # where the failures which are specific to one platform have shown up
        exclude:
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.13"
            os: macOS-latest
          - python-version: "3.12"
            os: windows-latest
    name: Python ${{ matrix.python-version }}, ${{ matrix.os }}, Group ${{matrix.group}} test
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .[test]
      - name: Test with pytest
        env:
          MPLBACKEND: "agg"
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml --splits 5 --group ${{matrix.group}}
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: true
