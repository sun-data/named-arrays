[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "named-arrays"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
    {name = "Jacob D. Parker", email="jacobdparker@gmail.com"}
]
description = "Numpy arrays with labeled axes, similar to xarray but with support for uncertainties"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>2",
    "numexpr",
    "matplotlib",
    "scipy",
    "astropy",
    "astroscrappy",
    "ndfilters~=1.0",
    "colorsynth~=1.0",
    "regridding~=3.4",
    "xarray",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-split",
]
doc = [
    "pytest",
    "graphviz",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "nbsphinx",
    "sphinx-codeautolink",
    "sphinx-favicon",
    "pooch",
]

[project.urls]
Homepage = "https://github.com/sun-data/named-arrays"
Documentation = "https://named-arrays.readthedocs.io/en/latest"

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
named_arrays = ["py.typed"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore: numpy.ndarray size changed, may indicate binary incompatibility. *:RuntimeWarning",
    # `numpy` 2.5.3 corrected the spelling of "uninitialized" in this warning,
    # so the optional `n` matches the message before and after that release
    "ignore: 'where' used without 'out', expect uni(ni)?tialized memory in output. If this is intentional, use out=None.",
    "ignore: function 'mod' is not known to astropy's Quantity. *",
    "ignore: invalid value encountered in divide",
    "ignore: 'mode' parameter is deprecated and will be removed",
    "ignore: More than 20 figures have been opened.",

]

[tool.coverage.report]
exclude_also = [
    "return NotImplemented",
    "raise ValueError",
    "raise NotImplementedError",
]
